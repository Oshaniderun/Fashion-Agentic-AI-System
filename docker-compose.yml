# STUB — not functional yet. Each agent needs its own Dockerfile before this runs.
# Build those once at least 2 agents work standalone (see docs/architecture/architecture.md).
# This file exists now so the shape of local multi-service orchestration is agreed on
# early, even though nobody should run `docker compose up` successfully yet.

version: "3.9"

services:
  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - agent1_wardrobe
      - agent2_retrieval
      - agent3_budget
      - agent4_decision

  agent1_wardrobe:
    build: ./agents/agent1_wardrobe
    ports:
      - "8001:8001"
    env_file: .env

  agent2_retrieval:
    build: ./agents/agent2_retrieval
    ports:
      - "8002:8002"
    env_file: .env

  agent3_budget:
    build: ./agents/agent3_budget
    ports:
      - "8003:8003"
    env_file: .env

  agent4_decision:
    build: ./agents/agent4_decision
    ports:
      - "8004:8004"
    env_file: .env

